<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar plataforma</title>
    <style>
        body {
            background-color: #e6e6fa;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-items: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            margin: 0;
        }

.formulario {
    background-color: #483d8b;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 300px;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
h1 {
    color: #6a5acd;
}  
input {
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-bottom: 15px;
}
button {
    background-color: #6a5acd;
    color: black;
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background-color: #483d8b;
}
    </style>
</head>
<body>
    <div class="formulario">
        <h1>Cadastrar plataforma</h1>
        <form>
            <input type="text" placeholder="Nome da plataforma">
            <br>
            <button type="button">Cadastrar</button>
        </form>
    </div>
</body>
</html>
