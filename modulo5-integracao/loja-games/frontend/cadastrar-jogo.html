<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Games - Cadastrar Jogo</title>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color:#000;
        color: blueviolet;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    
    }
.container {
    background-color: black;
    padding: 40px;
    border-radius: 12px;
    width: 420px;
    box-shadow:  0 4px 20px blue;
}  
h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #9f45e9;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #aaaaaa;
}
input, select{
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid black;
    border-radius: 6px;
    background-color: #9f45e9;
    color: #ba80eb;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 12px;
    background-color: blue;
    color: #ba80eb;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;

}
button:hover {
    background-color: #ba80eb;
}
</style>
</head>
<body>
    <div class="container">
        <h1>Cadastrar Jogo</h1>
        <form>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="EX: GTA">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="EX: Ação">

            <label for="preco">preco</label>
            <input type="number" id="preco" placeholder="EX:199.90" step="0.01">

            <label for="plataforma">Plataforma</label>
            <select id="Plataforma">
                <option value="">-- Selecione --</option>
                <option value="1">Playstation</option>
                <option value="2">XBox</option>
                <option value="3">PC</option>
            </select>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
